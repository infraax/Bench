<!doctype html>
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.nav != "home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#1c1915">
  <link rel="stylesheet" href="{{ '/assets/css/crypt.css' | relative_url }}">
  <link rel="alternate" type="text/plain" title="llms.txt — the site for language models" href="{{ '/llms.txt' | relative_url }}">
  <link rel="alternate" type="application/json" title="Bench API index" href="{{ '/api/index.json' | relative_url }}">
  <link rel="icon" href="{{ '/assets/diagrams/lamp.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="nav-{{ page.nav | default: 'doc' }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="lamp lamp--lit" aria-hidden="true"></span>Bench</a>
    <button class="navtoggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" aria-label="Site">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main id="main" class="{% if page.wide %}wide{% else %}prose{% endif %}">
    {{ content }}
  </main>

  <footer class="foot">
    <p class="foot__line">{{ site.tagline }}</p>
    <p class="foot__links">
      <a href="{{ site.repo }}/blob/HEAD/spec/BENCH_SPEC.md">Spec</a>
      <a href="{{ site.repo }}/blob/HEAD/LICENSE">License: MIT OR Apache-2.0</a>
      <a href="{{ site.repo }}">GitHub</a>
      <a href="{{ site.repo }}/tree/HEAD/docs/history">History</a>
      <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>
    </p>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
